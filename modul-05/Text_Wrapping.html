<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Float - Text Wrapping</title>
    <style>
        .container {
            background-color: red;
            margin: auto;
            width: 500px;
            padding: 5px;
        }

        .gambar {
            height: 150px;
            width: 150px;
            float: left;
            margin: 5px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="gambar"
            src="http://pics.unipma.ac.id/content/fasilitas/MAKNALAMBANG_02_06_2020_07_22_02logo.png"
            alt="Logo UNIPMA">

        <p class="tulisan">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem, sapiente animi dignissimos rem, autem sunt qui omnis ad sequi consequatur quis doloribus aspernatur asperiores veniam debitis, explicabo ex ab quasi.
        </p>
        <div class="clear"></div>
    </div>
</body>
</html>
