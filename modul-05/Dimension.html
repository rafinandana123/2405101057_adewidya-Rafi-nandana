<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title> CSS Layouting : Dimension </title>
    <style>
        .satu {
            width: 200px;
            height: 200px;
            background-color: pink;
        }
        .dua {
            width: 100%;
            height: 20%;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="satu">
        <div class="dua"></div>
        Hello World
    </div>
</body>
</html>
