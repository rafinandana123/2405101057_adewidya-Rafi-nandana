<!DOCTYPE html>
<html>
<head>
    <title>Contoh Program JavaScript</title>
    <script>
        function test() {
            var val1 = Number(window.prompt("Nilai I:"));
            var val2 = Number(window.prompt("Nilai II:"));
            document.write("<br>val1 == val2<br>");
            document.write(val1 == val2);
            document.write("<br><br>val1 != val2<br>");
            document.write(val1 != val2);
            document.write("<br><br>val1 > val2<br>");
            document.write(val1 > val2);
            document.write("<br><br>val1 < val2<br>");
            document.write(val1 < val2);
        }
    </script>
</head>
<body>
<input type="button" name="button1" value="Relational"
onclick="test()">
</body>
</html>
