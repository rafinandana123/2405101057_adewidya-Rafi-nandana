<!DOCTYPE html>
<html>
<head>
    <title>Contoh Program JavaScript</title>
    <script>
        function test(val1, val2) {
            document.write("<br>Perkalian: " + val1 + " * " + val2 + "<br>");
            document.write(val1 * val2);
            document.write("<br><br>Pembagian: " + val1 + " / " + val2 + "<br>");
            document.write(val1 / val2);
            document.write("<br><br>Penjumlahan: " + val1 + " + " + val2 + "<br>");
            document.write(val1 + val2);
            document.write("<br><br>Pengurangan: " + val1 + " - " + val2 + "<br>");
            document.write(val1 - val2);
            document.write("<br><br>Modulus: " + val1 + " % " + val2 + "<br>");
            document.write(val1 % val2);
        }
    </script>
</head>
<body>
<input type="button" name="button1" value="Arithmetic"
onclick="test(9, 4)">
</body>
</html>
