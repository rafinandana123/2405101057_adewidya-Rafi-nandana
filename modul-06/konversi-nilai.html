<!DOCTYPE html>
<html>
<head>
    <title>Konversi Nilai</title>
</head>
<body>
<h2>Konversi Nilai Angka ke Huruf</h2>
<form>
    <p>
        Masukkan Nilai:
        <input type="number" id="nilai" min="0" max="100">
    </p>

    <p>
        <input type="button" value="Konversi" onclick="konversi()">
    </p>

    <p>
        Nilai Huruf:
        <input type="text" id="hasil" readonly>
    </p>
</form>
<script>
    function konversi() {
        var nilaiInput = document.getElementById("nilai").value;
        var nilai = Number(nilaiInput);
        var hasil = "";
        if (nilaiInput == "") {
            alert("Masukkan nilai terlebih dahulu!");
            return;
        }
        if (nilai < 0 || nilai > 100) {
            alert("Nilai harus antara 0 sampai 100!");
            return;
        }
        if (nilai <= 40) {
            hasil = "E";
        } else if (nilai <= 55) {
            hasil = "D";
        } else if (nilai <= 60) {
            hasil = "C";
        } else if (nilai <= 65) {
            hasil = "BC";
        } else if (nilai <= 70) {
            hasil = "B";
        } else if (nilai <= 80) {
            hasil = "AB";
        } else {
            hasil = "A";
        }
        document.getElementById("hasil").value = hasil;
    }
</script>
</body>
</html>
